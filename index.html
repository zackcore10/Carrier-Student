<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerAI - Student Career Recommendation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 CareerAI</h1>

        <p class="subtitle">
            Discover the career path that fits your skills and interests.
        </p>

        <form id="careerForm">

            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="programming">Programming Skill</label>
            <select id="programming" required>
                <option value="">Select your level</option>
                <option value="Beginner">Beginner</option>
                <option value="Average">Average</option>
                <option value="Good">Good</option>
                <option value="Excellent">Excellent</option>
            </select>

            <label for="math">Mathematics Skill</label>
            <select id="math" required>
                <option value="">Select your level</option>
                <option value="Beginner">Beginner</option>
                <option value="Average">Average</option>
                <option value="Good">Good</option>
                <option value="Excellent">Excellent</option>
            </select>

            <label for="communication">Communication Skill</label>
            <select id="communication" required>
                <option value="">Select your level</option>
                <option value="Beginner">Beginner</option>
                <option value="Average">Average</option>
                <option value="Good">Good</option>
                <option value="Excellent">Excellent</option>
            </select>

            <label for="interest">Area of Interest</label>
            <select id="interest" required>
                <option value="">Select your interest</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Web Development">Web Development</option>
                <option value="Data Science">Data Science</option>
                <option value="Cyber Security">Cyber Security</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>

            <label for="experience">Experience Level</label>
            <select id="experience" required>
                <option value="">Select your experience</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <button type="submit">
                Analyze My Career 🚀
            </button>

        </form>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
